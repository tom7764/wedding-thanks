<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>창욱 ♥ 은 결혼식을 마치며</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+KR:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #FAF7F2;
            --warm-beige: #E8E0D5;
            --soft-gold: #C9A96E;
            --deep-brown: #5C4A3D;
            --text-dark: #3D3229;
            --text-light: #7A6B5E;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif KR', serif;
            background-color: var(--cream);
            color: var(--text-dark);
            line-height: 1.8;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 60px 24px;
            text-align: center;
        }

        /* 상단 장식 */
        .top-ornament {
            color: var(--soft-gold);
            font-size: 24px;
            letter-spacing: 12px;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeIn 1s ease forwards;
        }

        /* 메인 타이틀 */
        .main-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 6px;
            color: var(--text-light);
            text-transform: uppercase;
            margin-bottom: 24px;
            opacity: 0;
            animation: fadeIn 1s ease 0.2s forwards;
        }

        /* 이름 */
        .names {
            font-family: 'Noto Serif KR', serif;
            font-size: 32px;
            font-weight: 500;
            color: var(--text-dark);
            margin-bottom: 16px;
            opacity: 0;
            animation: fadeIn 1s ease 0.4s forwards;
        }

        .names .ampersand {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            color: var(--soft-gold);
            margin: 0 12px;
            font-weight: 400;
        }

        /* 날짜 */
        .date {
            font-family: 'Cormorant Garamond', serif;
            font-size: 18px;
            color: var(--text-light);
            letter-spacing: 3px;
            margin-bottom: 50px;
            opacity: 0;
            animation: fadeIn 1s ease 0.6s forwards;
        }

        /* 구분선 */
        .divider {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--soft-gold), transparent);
            margin: 0 auto 50px;
            opacity: 0;
            animation: fadeIn 1s ease 0.8s forwards;
        }

        /* 감사 메시지 */
        .message {
            font-size: 15px;
            font-weight: 300;
            color: var(--text-dark);
            line-height: 2.2;
            margin-bottom: 50px;
            opacity: 0;
            animation: fadeIn 1s ease 1s forwards;
        }

        .message p {
            margin-bottom: 24px;
        }

        .message p:last-child {
            margin-bottom: 0;
        }

        /* 하단 서명 */
        .signature {
            font-family: 'Cormorant Garamond', serif;
            font-size: 16px;
            font-style: italic;
            color: var(--text-light);
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeIn 1s ease 1.2s forwards;
        }

        /* 하단 장식 */
        .bottom-ornament {
            color: var(--soft-gold);
            font-size: 20px;
            letter-spacing: 8px;
            opacity: 0;
            animation: fadeIn 1s ease 1.4s forwards;
        }

        /* 이미지 섹션 (선택사항) */
        .photo-placeholder {
            width: 100%;
            max-width: 400px;
            height: 280px;
            margin: 0 auto 50px;
            background: var(--warm-beige);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-light);
            font-size: 13px;
            opacity: 0;
            animation: fadeIn 1s ease 0.8s forwards;
        }

        /* 애니메이션 */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 반응형 */
        @media (max-width: 480px) {
            .container {
                padding: 40px 20px;
            }

            .names {
                font-size: 26px;
            }

            .message {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-ornament">✦ ✦ ✦</div>
        
        <p class="main-title">Thank You</p>
        
        <h1 class="names">
            창욱<span class="ampersand">&</span>은
        </h1>
        
        <p class="date">2025. 11. 29</p>
        
        <div class="divider"></div>
        
        <!-- 사진을 넣고 싶으시면 아래 주석을 해제하고 이미지를 추가하세요 -->
        <!-- 
        <div class="photo-placeholder">
            <img src="your-photo.jpg" alt="웨딩 사진" style="width:100%; height:100%; object-fit:cover; border-radius:4px;">
        </div>
        -->
        
        <div class="message">
            <p>
                저희 두 사람의 새로운 시작을<br>
                함께 축복해 주신 모든 분들께<br>
                진심으로 감사드립니다.
            </p>
            <p>
                바쁘신 와중에도 귀한 걸음 해주시고<br>
                따뜻한 마음으로 축하해 주셔서<br>
                더욱 뜻깊은 하루가 되었습니다.
            </p>
            <p>
                보내주신 사랑과 축복을 마음에 새기며<br>
                서로 아끼고 사랑하며<br>
                행복하게 살겠습니다.
            </p>
            <p>
                감사합니다.
            </p>
        </div>
        
        <p class="signature">With love and gratitude</p>
        
        <div class="bottom-ornament">♥</div>
    </div>
</body>
</html>
